<!DOCTYPE html>
<html>
<body style="font: 12px Inter, sans-serif; margin: 12px; color: #192B43">
<div><b>HTML → Figma Bridge</b> — keep this window open.</div>
<div id="status" style="margin-top: 8px; color: #515C6B">Connecting…</div>
<script>
// Must match devAllowedDomains in manifest.json (Figma rejects IP literals there, so only localhost).
const BASE = "http://localhost:3999";
let connected = false;
let done = 0;
const status = (t) => (document.getElementById("status").textContent = t);

// Results from the main thread are forwarded to the local server.
window.onmessage = async (event) => {
  const msg = event.data && event.data.pluginMessage;
  if (!msg || msg.type !== "result") return;
  done += 1;
  status((msg.ok ? "OK" : "Error") + " · " + done + " scripts run");
  await fetch(BASE + "/result", { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(msg) });
};

async function loop() {
  for (;;) {
    try {
      if (!connected) {
        const r = await fetch(BASE + "/ping");
        if (!r.ok) throw new Error("ping " + r.status);
        connected = true;
        status("Connected · " + done + " scripts run");
      }
      const r = await fetch(BASE + "/next");
      if (r.status === 200) {
        const job = await r.json();
        status("Running script " + job.id + "…");
        parent.postMessage({ pluginMessage: { type: "run", id: job.id, code: job.code } }, "*");
      }
    } catch (e) {
      connected = false;
      status("Waiting for local server on " + BASE + "…");
      await new Promise((r) => setTimeout(r, 2000));
    }
  }
}
loop();
</script>
</body>
</html>
